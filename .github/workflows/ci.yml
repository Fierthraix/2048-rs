name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            shell: bash
            target: ""
          - name: macOS
            os: macos-latest
            shell: bash
            target: ""
          - name: Windows GNU
            os: windows-latest
            shell: msys2 {0}
            target: --target x86_64-pc-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ncurses pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ncurses)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install MSYS2 dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Windows GNU Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Check format
        shell: ${{ matrix.shell }}
        run: cargo fmt --check

      - name: Check
        shell: ${{ matrix.shell }}
        run: cargo check ${{ matrix.target }} --all-targets --all-features

      - name: Lint
        shell: ${{ matrix.shell }}
        run: cargo clippy ${{ matrix.target }} --all-targets --all-features -- -D warnings

      - name: Test
        shell: ${{ matrix.shell }}
        run: cargo test ${{ matrix.target }} --all-targets --all-features

      - name: Build release
        shell: ${{ matrix.shell }}
        run: cargo build ${{ matrix.target }} --release --all-features
